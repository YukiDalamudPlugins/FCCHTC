name: Release Build

# TC build. Push a v* tag (e.g. v2.3.2.1) and this builds against the TC (API 12)
# Dalamud and attaches the packaged plugin zip to a GitHub Release.
#
# The TC client uses XIVTheCalamity's Dalamud fork (API 12), NOT goatcorp's global
# latest. We download that exact distribution and point the build at it via DALAMUD_HOME
# (Dalamud.NET.Sdk maps DALAMUD_HOME -> DalamudLibPath; the csproj only hardcodes the local
# Calamity path when DALAMUD_HOME is unset). Building the net9.0-windows target on Linux
# needs EnableWindowsTargeting=true.

on:
  push:
    tags:
      - 'v*'
    branches:
      - tc
      - api12-tc
  workflow_dispatch:

permissions:
  contents: write   # needed to create a GitHub Release

env:
  # API 12 Dalamud for the TC region (PlusoneChiang fork — the one the Calamity launcher uses).
  # Bump when the TC client's Dalamud version changes. Can be overridden by the
  # DALAMUD_DISTRIB_URL repo variable without editing this file.
  DALAMUD_URL: ${{ vars.DALAMUD_DISTRIB_URL || 'https://github.com/PlusoneChiang/Dalamud/releases/download/12.0.1.5-tc.17/dalamud-tc-12.0.1.5-tc.17.zip' }}
  EnableWindowsTargeting: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download TC Dalamud (API 12)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/dalamud"
          curl -fsSL "$DALAMUD_URL" -o /tmp/dalamud.zip
          unzip -q /tmp/dalamud.zip -d "$HOME/dalamud"
          test -f "$HOME/dalamud/Dalamud.dll" || { echo "Dalamud.dll not found after extract"; ls -la "$HOME/dalamud"; exit 1; }
          echo "DALAMUD_HOME=$HOME/dalamud" >> "$GITHUB_ENV"

      - name: Build (Release)
        run: dotnet build FCCH.csproj -c Release --nologo

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCCH
          path: bin/Release/FCCH/latest.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/FCCH/latest.zip
          generate_release_notes: true
